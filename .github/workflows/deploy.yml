name: Auto-Sync Dashboard

on:
  schedule:
    - cron: '0 13 * * *' # Runs daily at 9:00 PM MYT (13:00 UTC)
  workflow_dispatch: # Allows manual trigger button in GitHub UI

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Sheet & Update index.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python agent.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet || git commit -m "Auto-sync spreadsheet logs to dashboard"
          git push
