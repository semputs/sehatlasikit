name: Auto-Sync Dashboard

on:
  schedule:
    # Runs at 01:00, 04:00, 07:00, 10:00, 13:00, 16:00 UTC
    # (Equivalent to 9 AM, 12 PM, 3 PM, 6 PM, 9 PM, 12 AM MYT)
    - cron: '0 1,4,7,10,13,16 * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Sheet & Update index.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python agent.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Auto-sync spreadsheet logs to dashboard"
            git push
          else
            echo "No changes detected in index.html."
          fi
          
