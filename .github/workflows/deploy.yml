name: Auto-Sync Dashboard

on:
  workflow_dispatch: # Allows n8n and manual triggers

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Sheet & Update index.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python agent.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Auto-sync spreadsheet logs to dashboard"
            git push
          else
            echo "No changes detected in index.html."
          fi
