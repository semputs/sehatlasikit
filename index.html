<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to KLHalf 2026</title>

  <!-- Open Graph & Twitter Cards -->
  <meta property="og:title" content="Road to KLHalf 2026 🏃‍♂️🍳">
  <meta property="og:description" content="Live training, weight tracking, and nutrition dashboard for KL Half Marathon 2026.">
  <meta property="og:image" content="https://raw.githubusercontent.com/semputs/sehatlasikit/main/semputsiapani.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Road to KLHalf 2026">
  <meta name="twitter:description" content="Live Half Marathon training & diet tracker.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/semputs/sehatlasikit/main/semputsiapani.png">

  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 0.75rem; }
    .gold-text { color: #f59e0b; }
    .lime-text { color: #10b981; }
  </style>
</head>
<body class="p-3 max-w-4xl mx-auto">

  <!-- Header & Race Countdown -->
  <header class="card p-4 mb-4 text-center">
    <h1 class="text-xl font-bold text-white mb-1">🏁 Road to KLHalf 2026</h1>
    <p class="text-xs text-gray-400 mb-3">Last updated: <span id="last-updated" class="text-gray-200">--</span></p>

    <div class="grid grid-cols-4 gap-2 text-center bg-gray-900/60 p-3 rounded-lg border border-gray-800">
      <div>
        <div id="cd-days" class="text-xl font-black text-lime-400">--</div>
        <div class="text-[9px] uppercase text-gray-400 font-semibold">Days</div>
      </div>
      <div>
        <div id="cd-hours" class="text-xl font-black text-lime-400">--</div>
        <div class="text-[9px] uppercase text-gray-400 font-semibold">Hours</div>
      </div>
      <div>
        <div id="cd-mins" class="text-xl font-black text-lime-400">--</div>
        <div class="text-[9px] uppercase text-gray-400 font-semibold">Mins</div>
      </div>
      <div>
        <div id="cd-secs" class="text-xl font-black text-lime-400">--</div>
        <div class="text-[9px] uppercase text-gray-400 font-semibold">Secs</div>
      </div>
    </div>
  </header>

  <!-- Top KPI Cards -->
  <section class="grid grid-cols-3 gap-2 mb-4">
    <!-- Current Weight Card -->
    <div class="card p-3">
      <p class="text-[10px] text-gray-400 uppercase">Current Wt</p>
      <div class="flex items-baseline space-x-1 my-0.5">
        <span id="kpi-weight" class="text-lg font-black text-white">--</span>
      </div>
      <span id="kpi-weight-date" class="text-[10px] text-gray-400 block font-normal">--</span>
    </div>

    <!-- Peak Speed Card -->
    <div class="card p-3">
      <p class="text-[10px] text-gray-400 uppercase">Peak Speed</p>
      <div class="flex items-baseline space-x-1 my-0.5">
        <span id="kpi-speed" class="text-lg font-black text-white">--</span>
      </div>
      <span id="kpi-speed-date" class="text-[10px] text-gray-400 block font-normal">--</span>
    </div>

    <!-- Peak Distance Card -->
    <div class="card p-3">
      <p class="text-[10px] text-gray-400 uppercase">Peak Distance</p>
      <div class="flex items-baseline space-x-1 my-0.5">
        <span id="kpi-distance" class="text-lg font-black text-white">--</span>
      </div>
      <span id="kpi-distance-date" class="text-[10px] text-gray-400 block font-normal">--</span>
    </div>
  </section>

  <!-- Charts Grid -->
  <section class="space-y-4 mb-6">
    <!-- Weight Chart -->
    <div class="card p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">📉 Weight Loss Progression</h2>
      <div class="h-48">
        <canvas id="weightChart"></canvas>
      </div>
    </div>

    <!-- Food Score Chart (With Average Line) -->
    <div class="card p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">🥗 Daily Avg Food Score</h2>
      <div class="h-48">
        <canvas id="foodChart"></canvas>
      </div>
    </div>

    <!-- Sleep Chart (With Average Line) -->
    <div class="card p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">😴 Sleep Duration (Hours)</h2>
      <div class="h-48">
        <canvas id="sleepChart"></canvas>
      </div>
    </div>

    <!-- Base Pace Speed Chart (With Average Line) -->
    <div class="card p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">🏃 Base Pace Progression (km/h)</h2>
      <div class="h-48">
        <canvas id="speedChart"></canvas>
      </div>
    </div>
  </section>

  <!-- Data Placeholder Injector -->
  <script>
    // GitHub Action injects raw Google Sheet JSON array into this variable
    window.dashboardData = [];
  </script>

  <!-- Countdown & Rendering Logic -->
  <script>
    // 1. Race Day Countdown (Nov 15, 2026 @ 04:00 AM MYT)
    const targetDate = new Date("2026-11-15T04:00:00+08:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;
      if (diff > 0) {
        document.getElementById("cd-days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
        document.getElementById("cd-hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
        document.getElementById("cd-mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        document.getElementById("cd-secs").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
      }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 2. Render Charts & Calculations once DOM is ready
    document.addEventListener("DOMContentLoaded", function () {
      const data = window.dashboardData || [];
      if (data.length === 0) return;

      const labels = data.map(d => d.date);

      // Utility: Calculate Average of non-null numbers
      function getAverage(arr) {
        const valid = arr.filter(v => v !== null && v !== undefined && !isNaN(v) && v > 0);
        if (valid.length === 0) return 0;
        return (valid.reduce((a, b) => a + b, 0) / valid.length).toFixed(1);
      }

      // -------------------------------------------------------------
      // Chart 1: Weight Loss
      // -------------------------------------------------------------
      const weights = data.map(d => {
        const match = d.weight ? d.weight.match(/\d+(?:\.\d+)?/) : null;
        return match ? parseFloat(match[0]) : null;
      });
      new Chart(document.getElementById('weightChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Weight (kg)',
            data: weights,
            borderColor: '#10B981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            spanGaps: true,
            fill: true,
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // -------------------------------------------------------------
      // Chart 2: Daily Avg Food Score + Dynamic Average Line
      // -------------------------------------------------------------
      const foodScores = data.map(d => {
        const scores = [parseFloat(d.b_score), parseFloat(d.l_score), parseFloat(d.d_score)].filter(s => !isNaN(s));
        return scores.length > 0 ? (scores.reduce((a, b) => a + b) / scores.length) : null;
      });
      const avgFoodScore = getAverage(foodScores);

      new Chart(document.getElementById('foodChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Daily Avg Score',
              data: foodScores,
              borderColor: '#10B981',
              spanGaps: true,
              tension: 0.3
            },
            {
              label: `Overall Avg (${avgFoodScore})`,
              data: new Array(labels.length).fill(avgFoodScore),
              borderColor: '#F59E0B',
              borderDash: [6, 6],
              borderWidth: 2,
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // -------------------------------------------------------------
      // Chart 3: Sleep Duration + Dynamic Average Line
      // -------------------------------------------------------------
      const sleepHours = data.map(d => {
        const val = parseFloat(d.sleep);
        return !isNaN(val) && val > 0 ? val : null;
      });
      const avgSleep = getAverage(sleepHours);

      new Chart(document.getElementById('sleepChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Sleep Hours',
              data: sleepHours,
              backgroundColor: '#3B82F6',
              borderRadius: 4
            },
            {
              type: 'line',
              label: `Overall Avg (${avgSleep} hrs)`,
              data: new Array(labels.length).fill(avgSleep),
              borderColor: '#EF4444',
              borderDash: [5, 5],
              borderWidth: 2,
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // -------------------------------------------------------------
      // Chart 4: Base Pace / Running Speed + Dynamic Average Line
      // -------------------------------------------------------------
      const speeds = data.map(d => {
        if (!d.activity) return null;
        const match = d.activity.match(/(?:@|speed|\b)(\d+\.\d+)\b/i);
        if (match) {
          const val = parseFloat(match[1]);
          return (val >= 4.0 && val <= 15.0) ? val : null;
        }
        return null;
      });
      const avgSpeed = getAverage(speeds);

      new Chart(document.getElementById('speedChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Speed (km/h)',
              data: speeds,
              borderColor: '#8B5CF6',
              spanGaps: true,
              tension: 0.2
            },
            {
              label: `Overall Avg (${avgSpeed} km/h)`,
              data: new Array(labels.length).fill(avgSpeed),
              borderColor: '#06B6D4',
              borderDash: [6, 6],
              borderWidth: 2,
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    });
  </script>
</body>
</html>
